name: Deploy Frontend to GitHub Pages

# Trigger on any push to main (so Pages stays in sync with the frontend/
# directory), OR manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# GitHub Pages deployment needs these permissions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancel any in-progress one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # Automatically enable Pages and set it to build from Actions.
          # This avoids the "Get Pages site failed" error on first run.
          enablement: true

      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Deploy everything inside frontend/
          path: './frontend'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
